name: profile art

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-art.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#326ce5&color_dots=#ebedf0,#bfdbfe,#7fb0f7,#4f8ff7,#1d4ed8
            dist/snake-dark.svg?palette=github-dark&color_snake=#2dd4a7&color_dots=#161b22,#13315c,#1d4ed8,#4f8ff7,#93c5fd
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
