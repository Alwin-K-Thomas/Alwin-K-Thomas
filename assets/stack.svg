<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 380" width="870" height="380" role="img" aria-labelledby="t d">
<title id="t">The platform, layer by layer</title>
<desc id="d">Isometric stack, bottom to top: infrastructure (Azure and on-prem, Terraform, observability); Kubernetes platform (multi-cluster, operators and CRDs, GitOps); zero-trust security (identity federation, RBAC, policy-as-code); AI infrastructure (GPU compute, LLM serving, ML workloads); trusted research environment (Five Safes, isolated research projects).</desc>
<defs>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1e2a4a"/></pattern>
  <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#4f8ff7" stop-opacity="0"/><stop offset=".5" stop-color="#4f8ff7" stop-opacity=".35"/><stop offset="1" stop-color="#2dd4a7" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
  .title{font:700 12.5px ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.5px}
  .tags{font:11px ui-monospace,Menlo,Consolas,monospace;fill:#94a3b8}
  .head{font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;fill:#64748b}
  .layer{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
  .tile{animation:tile 3.3s steps(1) infinite}
  @keyframes tile{0%,100%{opacity:1}50%{opacity:.3}}
  .flash{opacity:0;animation:flash 3.2s linear infinite}
  @keyframes flash{0%{opacity:.9}12%{opacity:0}100%{opacity:0}}
  .flashText{fill:#ffffff;opacity:0;animation:flash 3.2s linear infinite}
  @media (prefers-reduced-motion:reduce){.layer{animation:none;opacity:1}.tile,.flash,.flashText{animation:none}}
</style>
