<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 320" width="870" height="320" role="img" aria-labelledby="t d">
<title id="t">Now - Head of Platform Engineering, Lancashire Teaching Hospitals NHS Foundation Trust</title>
<desc id="d">Animated platform view: researchers sign in through identity federation and RBAC into isolated per-project Kubernetes namespaces, with GPU inference for clinical NLP and LLMs, controlled access to sensitive data, and zero-trust policy around the whole cluster.</desc>
<defs>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1e2a4a"/></pattern>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4f8ff7"/><stop offset="1" stop-color="#2dd4a7"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4f8ff7" stop-opacity=".25"/><stop offset="1" stop-color="#4f8ff7" stop-opacity="0"/>
  </radialGradient>
  <path id="p1" d="M418 160 C 450 160, 455 160, 482 160 S 540 104, 572 104"/>
  <path id="p2" d="M418 160 C 450 160, 455 160, 482 160 S 540 160, 572 160"/>
  <path id="p3" d="M418 160 C 450 160, 455 160, 482 160 S 540 216, 572 216"/>
  <g id="pod"><rect width="12" height="12" rx="2.5"/></g>
</defs>
<style>
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .label{font-size:10.5px;letter-spacing:2.5px;fill:#94a3b8}
  .small{font-size:10px;fill:#94a3b8}
  .ants{stroke-dasharray:6 5;animation:ants 1.4s linear infinite}
  @keyframes ants{to{stroke-dashoffset:-22}}
  .flow{stroke-dasharray:3 7;animation:ants 1s linear infinite}
  .pod{animation:pod 2.6s steps(1) infinite}
  @keyframes pod{0%,100%{opacity:1}40%{opacity:.25}55%{opacity:1}}
  .bar{transform-box:fill-box;transform-origin:bottom;animation:load 2.2s ease-in-out infinite alternate}
  @keyframes load{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
  .live{animation:live 1.2s steps(1) infinite}
  @keyframes live{50%{opacity:.2}}
  @media (prefers-reduced-motion:reduce){.ants,.flow,.pod,.bar,.pulse,.live{animation:none}}
</style>

<rect width="870" height="320" rx="14" fill="#0b1020"/>
<rect width="870" height="320" rx="14" fill="url(#dots)"/>
<rect x=".5" y=".5" width="869" height="319" rx="14" fill="none" stroke="#1e293b"/>

<!-- left: role card -->
<g class="mono">
  <circle cx="46" cy="58" r="4" fill="#2dd4a7" class="live"/>
  <text x="58" y="62" class="label" fill="#2dd4a7" style="fill:#2dd4a7">NOW · 2025 - PRESENT</text>
</g>
<text x="40" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="url(#title)">Trusted Research</text>
<text x="40" y="136" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="url(#title)">Environment</text>
<g class="mono">
  <text x="40" y="168" class="label" style="fill:#e2e8f0">HEAD OF PLATFORM ENGINEERING</text>
  <line x1="40" y1="184" x2="330" y2="184" stroke="#4f8ff7" stroke-opacity=".45"/>
  <text x="40" y="208" class="label">LANCASHIRE TEACHING HOSPITALS</text>
  <text x="40" y="226" class="label">NHS FOUNDATION TRUST</text>
  <text x="40" y="262" class="small">Five Safes · Multi-cluster · Azure + on-prem</text>
  <text x="40" y="280" class="small">Secure health data for research &amp; AI</text>
</g>

<line x1="372" y1="40" x2="372" y2="284" stroke="#1e293b"/>

<!-- researcher -->
<g transform="translate(404 160)">
  <circle r="26" fill="url(#halo)"/>
  <circle cy="-9" r="6" fill="#e2e8f0"/>
  <path d="M-11 12 a11 10 0 0 1 22 0 z" fill="#e2e8f0"/>
  <text y="40" text-anchor="middle" class="mono small">Researcher</text>
</g>

<!-- identity gate -->
<g transform="translate(482 160)">
  <path d="M0 -22 L17 -15 V2 C17 13 9 20 0 24 C-9 20 -17 13 -17 2 V-15 Z" fill="#111a33" stroke="#a78bfa" stroke-width="1.5"/>
  <path d="M-6 1 l4.5 4.5 l8 -9" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text y="44" text-anchor="middle" class="mono small" style="fill:#c4b5fd">SSO · RBAC</text>
</g>

<!-- flows -->
<g fill="none" stroke="#4f8ff7" stroke-opacity=".55" stroke-width="1.4">
  <use href="#p1" class="flow"/><use href="#p2" class="flow"/><use href="#p3" class="flow"/>
</g>
<circle r="3.2" fill="#2dd4a7"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
<circle r="3.2" fill="#2dd4a7"><animateMotion dur="2.6s" begin=".9s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
<circle r="3.2" fill="#2dd4a7"><animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>

<!-- cluster boundary: zero-trust -->
<rect x="548" y="44" width="300" height="236" rx="12" fill="#0d1530" fill-opacity=".85" stroke="#4f8ff7" stroke-width="1.4" class="ants"/>
<text x="562" y="64" class="mono label" style="fill:#4f8ff7">KUBERNETES · ZERO-TRUST</text>

<!-- namespaces -->
<g class="mono">
  <g transform="translate(572 82)">
    <rect width="118" height="44" rx="7" fill="#101b3a" stroke="#2dd4a7" stroke-opacity=".7" stroke-dasharray="3 3"/>
    <text x="9" y="15" class="small" style="fill:#2dd4a7">ns/project-a</text>
    <g fill="#2dd4a7"><use href="#pod" x="9" y="23" class="pod"/><use href="#pod" x="26" y="23" class="pod" style="animation-delay:.7s"/><use href="#pod" x="43" y="23" class="pod" style="animation-delay:1.5s"/></g>
  </g>
  <g transform="translate(572 138)">
    <rect width="118" height="44" rx="7" fill="#101b3a" stroke="#2dd4a7" stroke-opacity=".7" stroke-dasharray="3 3"/>
    <text x="9" y="15" class="small" style="fill:#2dd4a7">ns/project-b</text>
    <g fill="#2dd4a7"><use href="#pod" x="9" y="23" class="pod" style="animation-delay:1.1s"/><use href="#pod" x="26" y="23" class="pod" style="animation-delay:.3s"/></g>
  </g>
  <g transform="translate(572 194)">
    <rect width="118" height="44" rx="7" fill="#101b3a" stroke="#2dd4a7" stroke-opacity=".7" stroke-dasharray="3 3"/>
    <text x="9" y="15" class="small" style="fill:#2dd4a7">ns/project-c</text>
    <g fill="#2dd4a7"><use href="#pod" x="9" y="23" class="pod" style="animation-delay:.5s"/><use href="#pod" x="26" y="23" class="pod" style="animation-delay:1.9s"/><use href="#pod" x="43" y="23" class="pod" style="animation-delay:1.2s"/><use href="#pod" x="60" y="23" class="pod" style="animation-delay:2.2s"/></g>
  </g>
</g>

<!-- namespace → GPU / data -->
<g fill="none" stroke="#76b900" stroke-opacity=".6" stroke-width="1.3">
  <path d="M690 104 C 712 104, 712 112, 728 112" class="flow"/>
  <path d="M690 160 C 712 160, 712 124, 728 124" class="flow"/>
</g>
<g fill="none" stroke="#f5a524" stroke-opacity=".55" stroke-width="1.3">
  <path d="M690 216 C 712 216, 712 222, 734 222" class="flow"/>
  <path d="M690 160 C 712 160, 714 210, 734 212" class="flow"/>
</g>

<!-- GPU node -->
<g class="mono" transform="translate(728 82)">
  <rect width="104" height="78" rx="8" fill="#0f1a10" stroke="#76b900" stroke-opacity=".8"/>
  <text x="10" y="17" class="small" style="fill:#a3e635">GPU inference</text>
  <g fill="#76b900">
    <rect x="12" y="28" width="12" height="30" rx="2" class="bar"/>
    <rect x="30" y="28" width="12" height="30" rx="2" class="bar" style="animation-delay:.4s"/>
    <rect x="48" y="28" width="12" height="30" rx="2" class="bar" style="animation-delay:.9s"/>
    <rect x="66" y="28" width="12" height="30" rx="2" class="bar" style="animation-delay:.2s"/>
    <rect x="84" y="28" width="10" height="30" rx="2" class="bar" style="animation-delay:1.3s"/>
  </g>
  <text x="10" y="72" class="small" style="fill:#a3e635">NLP · LLM</text>
</g>

<!-- data -->
<g class="mono" transform="translate(734 196)">
  <path d="M0 8 v34 a46 9 0 0 0 92 0 v-34" fill="#1a1408" stroke="#f5a524" stroke-opacity=".8"/>
  <ellipse cx="46" cy="8" rx="46" ry="9" fill="#2a1f0a" stroke="#f5a524" stroke-opacity=".8"/>
  <text x="46" y="32" text-anchor="middle" class="small" style="fill:#fcd34d">Sensitive</text>
  <text x="46" y="45" text-anchor="middle" class="small" style="fill:#fcd34d">data</text>
</g>

<!-- policy shield badge -->
<g transform="translate(820 58)">
  <circle r="11" fill="#0b1020" stroke="#a78bfa"/>
  <circle r="15" fill="none" stroke="#a78bfa" stroke-opacity=".6" class="pulse"/>
  <path d="M-4 0 l3 3 l5.5 -6" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<text x="698" y="304" text-anchor="middle" class="mono small">Policy-as-code · CRDs · GitOps · Observability</text>
</svg>
