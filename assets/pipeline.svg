<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 320" width="870" height="320" role="img" aria-labelledby="t d">
<title id="t">VFX pipeline engineering at MPC · Technicolor, 2017–2025</title>
<desc id="d">Animated pipeline view: a USD-style asset hierarchy (show, sequence, shot, asset, version); a Python and Qt review platform with plug-ins for playback and feedback; shots flowing through production departments over an event-driven, API-first microservices bus with caching, across multiple sites.</desc>
<defs>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2a2216"/></pattern>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f5a524"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b2a5c"/><stop offset=".6" stop-color="#c2410c"/><stop offset="1" stop-color="#f5a524"/>
  </linearGradient>
  <g id="shot">
    <rect x="-9" y="-7" width="18" height="14" rx="2" fill="#1a1408" stroke="#f5a524"/>
    <rect x="-5" y="-3.5" width="10" height="7" rx="1" fill="#f5a524" fill-opacity=".7"/>
  </g>
</defs>
<style>
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .label{font-size:10.5px;letter-spacing:2.5px;fill:#94a3b8}
  .small{font-size:10px;fill:#94a3b8}
  .node{font-size:10.5px;fill:#fde68a}
  .row{opacity:0;animation:row 7s ease-out infinite}
  @keyframes row{0%{opacity:0;transform:translateX(-6px)}6%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
  .ver{opacity:0;animation:ver 6s steps(1) infinite}
  @keyframes ver{0%,33%{opacity:1}34%,100%{opacity:0}}
  .ants{stroke-dasharray:6 5;animation:ants 1.2s linear infinite}
  @keyframes ants{to{stroke-dashoffset:-22}}
  .note{transform-box:fill-box;transform-origin:center;animation:note 2.4s ease-in-out infinite}
  @keyframes note{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.05)}}
  .stn{animation:stn 2s linear infinite}
  @keyframes stn{0%{fill:#f5a524;stroke:#fde68a}18%,100%{fill:#1a1408;stroke:#f5a524}}
  .chip{animation:chip 4.5s steps(1) infinite}
  @keyframes chip{0%,32%{stroke:#f5a524;fill:#2a1f0a}33%,100%{stroke:#3a3020;fill:#14100a}}
  @media (prefers-reduced-motion:reduce){.row,.ver,.ants,.note,.stn,.chip{animation:none;opacity:1}}
</style>

<rect width="870" height="320" rx="14" fill="#0f0c08"/>
<rect width="870" height="320" rx="14" fill="url(#dots)"/>
<rect x=".5" y=".5" width="869" height="319" rx="14" fill="none" stroke="#2a2216"/>

<!-- left: role card -->
<g class="mono">
  <circle cx="46" cy="58" r="4" fill="#f5a524"/>
  <text x="58" y="62" class="label" style="fill:#f5a524">2017 – 2025</text>
</g>
<text x="40" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="url(#title)">VFX Pipeline</text>
<text x="40" y="136" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="url(#title)">Engineering</text>
<g class="mono">
  <text x="40" y="168" class="label" style="fill:#e2e8f0">PIPELINE ARCHITECTURE &amp; TOOLING</text>
  <line x1="40" y1="184" x2="330" y2="184" stroke="#f5a524" stroke-opacity=".45"/>
  <text x="40" y="208" class="label">MPC · TECHNICOLOR</text>
  <text x="40" y="226" class="label">CREATIVE STUDIOS</text>
  <text x="40" y="254" class="small">Python · Qt · Microservices · MySQL / NoSQL</text>
  <text x="40" y="272" class="small">Packaged, orchestrated services</text>
  <text x="40" y="290" class="small">Software behind feature-film VFX</text>
</g>

<line x1="372" y1="40" x2="372" y2="284" stroke="#2a2216"/>

<!-- asset hierarchy (USD-style) -->
<g class="mono">
  <text x="396" y="58" class="label" style="fill:#f5a524">ASSETS · USD-STYLE</text>
  <g stroke="#f5a524" stroke-opacity=".45" fill="none">
    <path d="M404 86 V102 H418 M420 106 V122 H434 M436 126 V142 H450 M452 146 V162 H466"/>
  </g>
  <g class="row" style="animation-delay:0s"><rect x="398" y="76" width="8" height="8" rx="2" fill="#f5a524"/><text x="412" y="84" class="node">Show</text></g>
  <g class="row" style="animation-delay:.35s"><rect x="414" y="96" width="8" height="8" rx="2" fill="#f5a524" fill-opacity=".8"/><text x="428" y="104" class="node">Sequence</text></g>
  <g class="row" style="animation-delay:.7s"><rect x="430" y="116" width="8" height="8" rx="2" fill="#f5a524" fill-opacity=".65"/><text x="444" y="124" class="node">Shot</text></g>
  <g class="row" style="animation-delay:1.05s"><rect x="446" y="136" width="8" height="8" rx="2" fill="#f5a524" fill-opacity=".5"/><text x="460" y="144" class="node">Asset</text></g>
  <g class="row" style="animation-delay:1.4s">
    <rect x="462" y="156" width="8" height="8" rx="2" fill="#f472b6"/>
    <text x="476" y="164" class="node" style="fill:#f9a8d4">Version</text>
    <text x="532" y="164" class="node ver" style="fill:#f472b6;animation-delay:0s">v011</text>
    <text x="532" y="164" class="node ver" style="fill:#f472b6;animation-delay:2s">v012</text>
    <text x="532" y="164" class="node ver" style="fill:#f472b6;animation-delay:4s">v013</text>
  </g>
</g>

<!-- review platform -->
<g class="mono">
  <text x="622" y="58" class="label" style="fill:#f5a524">REVIEW · PYTHON + QT</text>
  <rect x="620" y="70" width="228" height="112" rx="8" fill="#14100a" stroke="#3a3020"/>
  <rect x="630" y="80" width="208" height="56" rx="3" fill="url(#screen)"/>
  <circle cx="700" cy="104" r="9" fill="#fde68a" fill-opacity=".85"/>
  <path d="M630 136 L668 112 L690 124 L724 98 L770 128 L800 110 L838 132 V136 Z" fill="#0f0c08" fill-opacity=".85"/>
  <circle cx="790" cy="100" r="11" fill="none" stroke="#f472b6" stroke-width="2" class="note"/>
  <line x1="630" y1="146" x2="838" y2="146" stroke="#3a3020" stroke-width="3" stroke-linecap="round"/>
  <line x1="630" y1="146" x2="838" y2="146" stroke="#f5a524" stroke-width="3" stroke-linecap="round" stroke-dasharray="208 208" stroke-dashoffset="208">
    <animate attributeName="stroke-dashoffset" from="208" to="0" dur="4.5s" repeatCount="indefinite"/>
  </line>
  <rect x="628" y="140" width="4" height="12" rx="1" fill="#ffffff">
    <animate attributeName="x" from="628" to="836" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <g>
    <rect x="630" y="158" width="64" height="16" rx="8" stroke-width="1" class="chip"/>
    <text x="662" y="169.5" text-anchor="middle" class="small" style="fill:#fde68a">Playback</text>
    <rect x="702" y="158" width="64" height="16" rx="8" stroke-width="1" class="chip" style="animation-delay:1.5s"/>
    <text x="734" y="169.5" text-anchor="middle" class="small" style="fill:#fde68a">Plug-ins</text>
    <rect x="774" y="158" width="64" height="16" rx="8" stroke-width="1" class="chip" style="animation-delay:3s"/>
    <text x="806" y="169.5" text-anchor="middle" class="small" style="fill:#fde68a">Feedback</text>
  </g>
</g>

<!-- event bus + departments -->
<g class="mono">
  <text x="396" y="212" class="label" style="fill:#f5a524">EVENT-DRIVEN MICROSERVICES</text>
  <line x1="400" y1="224" x2="840" y2="224" stroke="#f472b6" stroke-opacity=".6" stroke-width="1.3" class="ants"/>
  <line x1="400" y1="252" x2="840" y2="252" stroke="#3a3020" stroke-width="2"/>
  <g stroke-width="1.5">
    <circle cx="410" cy="252" r="7" class="stn" style="animation-delay:.14s"/>
    <circle cx="490" cy="252" r="7" class="stn" style="animation-delay:1.23s"/>
    <circle cx="570" cy="252" r="7" class="stn" style="animation-delay:.32s"/>
    <circle cx="650" cy="252" r="7" class="stn" style="animation-delay:1.41s"/>
    <circle cx="730" cy="252" r="7" class="stn" style="animation-delay:.5s"/>
    <circle cx="810" cy="252" r="7" class="stn" style="animation-delay:1.59s"/>
  </g>
  <g text-anchor="middle" class="small">
    <text x="410" y="276">Layout</text><text x="490" y="276">Anim</text><text x="570" y="276">FX</text>
    <text x="650" y="276">Lighting</text><text x="730" y="276">Comp</text><text x="810" y="276">Review</text>
  </g>
  <g stroke="#f472b6" stroke-opacity=".35">
    <line x1="410" y1="226" x2="410" y2="244"/><line x1="490" y1="226" x2="490" y2="244"/><line x1="570" y1="226" x2="570" y2="244"/>
    <line x1="650" y1="226" x2="650" y2="244"/><line x1="730" y1="226" x2="730" y2="244"/><line x1="810" y1="226" x2="810" y2="244"/>
  </g>
</g>
<use href="#shot"><animateMotion path="M400 252 H840" dur="6s" repeatCount="indefinite"/></use>
<use href="#shot"><animateMotion path="M400 252 H840" dur="6s" begin="2s" repeatCount="indefinite"/></use>
<use href="#shot"><animateMotion path="M400 252 H840" dur="6s" begin="4s" repeatCount="indefinite"/></use>

<text x="620" y="304" text-anchor="middle" class="mono small">Multi-site · API-first · Event-driven · Cached</text>
</svg>
